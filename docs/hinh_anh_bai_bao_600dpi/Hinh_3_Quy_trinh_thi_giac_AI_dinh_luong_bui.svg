<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 800" width="540" height="800" style="background-color:#ffffff; font-family:'Segoe UI', Arial, Helvetica, sans-serif;">
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="540" height="800" fill="#ffffff"/>

  <!-- Main Title -->
  <text x="270" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a" letter-spacing="0.3">QUY TRÌNH THỊ GIÁC MÁY TÍNH ĐA TẦNG</text>
  <text x="270" y="46" text-anchor="middle" font-size="12" font-weight="bold" fill="#2563eb">(MULTI-STAGE EDGE-AI PIPELINE)</text>

  <!-- ==================== 0. INPUT ==================== -->
  <rect x="70" y="58" width="400" height="38" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1.8"/>
  <text x="270" y="82" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">Ảnh chụp bề mặt tấm pin từ camera (1080p ngoài trời)</text>

  <line x1="270" y1="96" x2="270" y2="115" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ==================== TẦNG 1: KHỞI TẠO PHỐI CẢNH ==================== -->
  <rect x="20" y="115" width="500" height="108" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
  <text x="270" y="136" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">TẦNG 1: KHỞI TẠO &amp; HIỆU CHỈNH PHỐI CẢNH (CHẠY 1 LẦN)</text>
  
  <rect x="35" y="148" width="470" height="62" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
  <text x="270" y="167" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#b45309">Mô hình YOLOv8-Seg (panel_2.pt) • mAP@0.5: 97,1%</text>
  <text x="270" y="186" text-anchor="middle" font-size="10.5" fill="#78350f">• Trích xuất mặt nạ phân đoạn bề mặt, xác định 4 điểm góc viền pin</text>
  <text x="270" y="201" text-anchor="middle" font-size="10.5" fill="#78350f">• Lập ma trận phối cảnh M_persp cố định (loại bỏ 100% nền ngoại cảnh; tái hiệu chuẩn khi rung lắc)</text>

  <line x1="270" y1="223" x2="270" y2="248" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ==================== ẢNH HIỆU CHỈNH PHẲNG ==================== -->
  <rect x="110" y="248" width="320" height="32" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
  <text x="270" y="269" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#0369a1">Ảnh bề mặt pin đã hiệu chỉnh góc nhìn phẳng</text>

  <!-- Mũi tên rẽ 2 luồng Tầng 2 -->
  <path d="M 270 280 L 270 300 L 140 300 L 140 318" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M 270 280 L 270 300 L 400 300 L 400 318" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- ==================== TẦNG 2: CHU KỲ SUY LUẬN AI BIÊN ==================== -->

  <!-- LUỒNG A (TRÁI): DỊ VẬT CẢN QUANG -->
  <rect x="15" y="318" width="250" height="340" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
  <text x="140" y="338" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">LUỒNG A: DỊ VẬT CẢN QUANG</text>
  <text x="140" y="353" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">(ƯU TIÊN 1 - KHẨN CẤP)</text>

  <!-- Khối YOLOv8 -->
  <rect x="25" y="365" width="230" height="110" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <text x="140" y="386" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#92400e">Mô hình YOLOv8 (Solar.pt)</text>
  <text x="140" y="403" text-anchor="middle" font-size="10.5" fill="#78350f">• Độ trễ suy luận: 106,8 ms</text>
  <text x="140" y="420" text-anchor="middle" font-size="10.5" fill="#78350f">• mAP@0.5: 79,5% | P: 81,8%</text>
  <text x="140" y="442" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#b45309">Phát hiện hộp bao (Bounding Box):</text>
  <text x="140" y="459" text-anchor="middle" font-size="10" fill="#78350f">Lá cây (Leaf), Phân chim (Bird drop)</text>

  <line x1="140" y1="475" x2="140" y2="502" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Tác động & Cờ Ưu tiên 1 -->
  <rect x="25" y="502" width="230" height="75" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="140" y="522" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">Kích hoạt Cờ Ưu tiên 1 (PLC)</text>
  <text x="140" y="540" text-anchor="middle" font-size="10" fill="#b91c1c">• DB1.DBX0.1 (Lá cây)</text>
  <text x="140" y="556" text-anchor="middle" font-size="10" fill="#b91c1c">• DB1.DBX0.2 (Phân chim)</text>
  <text x="140" y="570" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#7f1d1d">→ Giảm nguy cơ điểm nóng nhiệt</text>

  <!-- LUỒNG B (PHẢI): MÀNG BỤI PHÂN TÁN -->
  <rect x="275" y="318" width="250" height="340" rx="6" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="400" y="338" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#5b21b6">LUỒNG B: MÀNG BỤI PHÂN TÁN</text>
  <text x="400" y="353" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#6d28d9">(ƯU TIÊN 2 - ĐỊNH KỲ)</text>

  <!-- Khối chia lưới 32 ô -->
  <rect x="285" y="365" width="230" height="52" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.2"/>
  <text x="400" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#0369a1">Chia ma trận 8 × 4 (32 ô)</text>
  <text x="400" y="403" text-anchor="middle" font-size="10" fill="#075985">Kích thước chuẩn hóa: 224 × 224 px</text>

  <line x1="400" y1="417" x2="400" y2="432" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Khối EfficientNet-B0 -->
  <rect x="285" y="432" width="230" height="72" rx="4" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="400" y="451" text-anchor="middle" font-size="11" font-weight="bold" fill="#5b21b6">EfficientNet-B0 (TFLite 6,2 MB)</text>
  <text x="400" y="468" text-anchor="middle" font-size="10" fill="#6d28d9">• Độ trễ 32 ô: 995,1 ms | Acc: 96,8%</text>
  <text x="400" y="485" text-anchor="middle" font-size="10" fill="#6d28d9">• Phân loại nhị phân: Sạch (0) / Bẩn (1)</text>

  <line x1="400" y1="504" x2="400" y2="520" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Khối Định lượng tỷ lệ bẩn -->
  <rect x="285" y="520" width="230" height="72" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="539" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">Định lượng diện tích bám bụi</text>
  <text x="400" y="556" text-anchor="middle" font-size="10" fill="#15803d">• η_soiled = (∑ ŷk / 32) × 100%</text>
  <text x="400" y="572" text-anchor="middle" font-size="10" fill="#15803d">• Cờ Ưu tiên 2: DB1.DBX0.0 (khi η ≥ η_th)</text>

  <!-- HỘP KẾT HỢP DƯỚI -->
  <path d="M 140 658 L 140 682 L 270 682" fill="none" stroke="#334155" stroke-width="1.8"/>
  <path d="M 400 658 L 400 682 L 270 682" fill="none" stroke="#334155" stroke-width="1.8"/>
  <line x1="270" y1="682" x2="270" y2="702" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ==================== TẦNG 3: TRUYỀN THÔNG SNAP7 SANG PLC ==================== -->
  <rect x="30" y="702" width="480" height="78" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.8"/>
  <text x="270" y="724" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">ĐIỀU PHỐI QUYẾT ĐỊNH &amp; TRUYỀN THÔNG SNAP7 SANG PLC</text>
  <text x="270" y="744" text-anchor="middle" font-size="10.5" fill="#334155">• Gói tin trạng thái nhị phân truyền qua Ethernet TCP/IP (cổng 102) dưới 15 ms</text>
  <text x="270" y="762" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#166534">• PLC Siemens S7-1200 CPU 1214C kích hoạt chu trình làm sạch tương ứng</text>

</svg>
