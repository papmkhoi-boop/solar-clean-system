<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — Hệ thống vệ sinh tấm pin mặt trời</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --surface: #151b28;
            --card: #1a2235;
            --border: #2a3348;
            --border-focus: #3b82f6;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --text3: #64748b;
            --blue: #3b82f6;
            --blue-hover: #2563eb;
            --red: #ef4444;
            --green: #22c55e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .login-wrapper { position: relative; z-index: 1; width: 100%; max-width: 400px; padding: 20px; }
        .brand { text-align: center; margin-bottom: 32px; }
        .brand-logo { width: 56px; height: 56px; border-radius: 12px; margin-bottom: 16px; object-fit: contain; }
        .brand-title { font-size: 18px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 4px; }
        .brand-sub { font-size: 13px; color: var(--text3); }
        .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 32px 28px 28px; box-shadow: 0 4px 24px rgba(0,0,0,.4); }
        .login-heading { font-size: 15px; font-weight: 700; margin-bottom: 24px; color: var(--text); }
        .input-group { margin-bottom: 18px; }
        .input-label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
        .input-wrap { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 12px; color: var(--text3); font-size: 15px; }
        .input-field { width: 100%; padding: 11px 12px 11px 38px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; outline: none; transition: border-color .2s; }
        .input-field:focus { border-color: var(--border-focus); }
        .btn-login { width: 100%; padding: 12px; background: var(--blue); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-login:hover { background: var(--blue-hover); }
        .login-footer { text-align: center; margin-top: 20px; font-size: 11px; color: var(--text3); }
        .pw-toggle { position: absolute; right: 10px; background: none; border: none; color: var(--text3); cursor: pointer; font-size: 15px; }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="brand">
            <img src="/static/ctut.webp" class="brand-logo" alt="">
            <div class="brand-title">Hệ Thống Vệ Sinh Tấm Pin Mặt Trời</div>
            <div class="brand-sub">SCADA Web Monitor</div>
        </div>
        <div class="login-card">
            <div class="login-heading">Đăng nhập để tiếp tục</div>
            {% if error %}
            <div style="background:rgba(239,68,68,.1); border:1px solid rgba(239,68,68,.3); border-radius:8px; color:var(--red); font-size:13px; padding:10px; margin-bottom:18px;">
                {{ error }}
            </div>
            {% endif %}
            <form method="POST" action="/login">
                <div class="input-group">
                    <label class="input-label">Tên tài khoản</label>
                    <div class="input-wrap">
                        <input type="text" name="username" class="input-field" placeholder="Nhập tên tài khoản" required autofocus>
                        <i class="bi bi-person input-icon"></i>
                    </div>
                </div>
                <div class="input-group">
                    <label class="input-label">Mật khẩu</label>
                    <div class="input-wrap">
                        <input type="password" id="password" name="password" class="input-field" placeholder="Nhập mật khẩu" required>
                        <i class="bi bi-lock input-icon"></i>
                        <button type="button" class="pw-toggle" onclick="document.getElementById('password').type = document.getElementById('password').type==='password'?'text':'password'"><i class="bi bi-eye"></i></button>
                    </div>
                </div>
                <button type="submit" class="btn-login">Đăng nhập</button>
            </form>
            <div style="text-align:center; margin-top: 16px; font-size: 13px; color: var(--text3);">
                Chưa có tài khoản? <a href="/register" style="color: var(--blue); text-decoration: none; font-weight: 600;">Đăng ký</a>
            </div>
        </div>
        <div class="login-footer">Hệ thống vệ sinh tấm pin mặt trời v2.5 — SCADA Monitor</div>
    </div>
</body>
</html>
