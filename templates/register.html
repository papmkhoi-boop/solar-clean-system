<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký — Hệ thống vệ sinh tấm pin mặt trời</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0e14;
            --surface: #151b28;
            --card: #1a2235;
            --border: #2a3348;
            --border-focus: #3b82f6;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --text3: #64748b;
            --blue: #3b82f6;
            --blue-hover: #2563eb;
            --red: #ef4444;
            --green: #22c55e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .register-wrapper { width: 100%; max-width: 440px; padding: 20px; }
        .brand { text-align: center; margin-bottom: 32px; }
        .brand-logo { width: 56px; height: 56px; border-radius: 12px; margin-bottom: 16px; object-fit: contain; }
        .brand-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .register-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 32px 28px 28px; }
        .register-heading { font-size: 15px; font-weight: 700; margin-bottom: 24px; }
        .input-group { margin-bottom: 16px; }
        .input-label { display: block; font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
        .input-wrap { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 12px; color: var(--text3); }
        .input-field { width: 100%; padding: 11px 12px 11px 38px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 14px; outline: none; }
        .btn-register { width: 100%; padding: 12px; background: var(--blue); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .btn-register:hover { background: var(--blue-hover); }
        .login-link { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text3); }
        .login-link a { color: var(--blue); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="register-wrapper">
        <div class="brand">
            <img src="/static/ctut.webp" class="brand-logo" alt="">
            <div class="brand-title">Hệ Thống Vệ Sinh Tấm Pin Mặt Trời</div>
            <div class="brand-sub">Đăng ký tài khoản mới</div>
        </div>
        <div class="register-card">
            <div class="register-heading">Tạo tài khoản</div>
            {% if error %}<div style="color:var(--red); padding:10px; margin-bottom:10px;">{{ error }}</div>{% endif %}
            {% if success %}<div style="color:var(--green); padding:10px; margin-bottom:10px;">{{ success }}</div>
            {% else %}
            <form method="POST" action="/register">
                <div class="input-group">
                    <label class="input-label">Họ và tên</label>
                    <div class="input-wrap">
                        <input type="text" name="fullname" class="input-field" placeholder="Nhập họ và tên">
                        <i class="bi bi-person-badge input-icon"></i>
                    </div>
                </div>
                <div class="input-group">
                    <label class="input-label">Tên tài khoản *</label>
                    <div class="input-wrap">
                        <input type="text" name="username" class="input-field" placeholder="Tối thiểu 3 ký tự" required>
                        <i class="bi bi-person input-icon"></i>
                    </div>
                </div>
                <div class="input-group">
                    <label class="input-label">Mật khẩu *</label>
                    <div class="input-wrap">
                        <input type="password" name="password" class="input-field" placeholder="Tối thiểu 4 ký tự" required>
                        <i class="bi bi-lock input-icon"></i>
                    </div>
                </div>
                <button type="submit" class="btn-register">Đăng ký</button>
            </form>
            {% endif %}
            <div class="login-link">Đã có tài khoản? <a href="/login">Đăng nhập</a></div>
        </div>
    </div>
</body>
</html>
